<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OGraf renderer</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      body { cursor: none; }
      #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
      #stage > iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; color-scheme: normal; }
      html.checker body { background: repeating-conic-gradient(#666 0 25%, #888 0 50%) 0 0 / 40px 40px; }
      html.debug body { cursor: default; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      // Boot diagnostics (read by the player's PGM preview) and watchdog: if the renderer did not start
      // (e.g. a script failed to load), reload until it does.
      window.ogpBoot = { errors: [] };
      window.addEventListener('error', function (e) {
        var t = e.target;
        var msg = t && t !== window && (t.src || t.href) ? 'failed to load ' + (t.src || t.href) : String(e.message || e.error);
        window.ogpBoot.errors.push(msg);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        window.ogpBoot.errors.push('unhandled rejection: ' + String(e.reason && e.reason.message || e.reason));
      });
      setTimeout(function () { if (!window.ogpRenderer) location.reload(); }, 5000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
